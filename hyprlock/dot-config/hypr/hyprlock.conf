# Hyprlock Configuration — Minimal Solid Background with Live Clock
# Location: ~/.config/hypr/hyprlock.conf

background {
    monitor =
    color = rgb(29, 32, 33)                  # Clean solid dark (#1d2021)
}

# Live Clock (Hours : Minutes AM/PM)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%I:%M %p")"
    color = rgb(235, 219, 178)              # Gruvbox cream fg (#ebdbb2)
    font_size = 64
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 80
    halign = center
    valign = center
}

# Date Subtitle
label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %B %d, %Y")"
    color = rgb(215, 153, 33)              # Gruvbox yellow (#d79921)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 16
    halign = center
    valign = center
}

# Password Input Field
input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgb(215, 153, 33)        # Gruvbox yellow border
    inner_color = rgb(40, 40, 40)          # Gruvbox dark pill (#282828)
    font_color = rgb(235, 219, 178)
    fade_on_empty = false
    placeholder_text = <span foreground="##a89984">Password...</span>
    hide_input = false
    check_color = rgb(184, 187, 38)        # Gruvbox green on verifying
    fail_color = rgb(204, 36, 29)          # Gruvbox red on failure
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    position = 0, -60
    halign = center
    valign = center
}
