# Hyprlock theme: solarized-osaka
# Auto-generated by theme-switch — do not edit directly.

general {
    hide_cursor = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 7
    brightness = 0.75
    contrast = 0.9
    vibrancy = 0.15
    vibrancy_darkness = 0.0
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%I:%M %p")"
    color = rgba(145, 168, 170, 1.0)
    font_size = 64
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d")"
    color = rgba(120, 149, 160, 1.0)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 10
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(0, 40, 49, 1.0)
    inner_color = rgba(3, 18, 25, 0.9)
    font_color = rgba(145, 168, 170, 1.0)
    fade_on_empty = false
    placeholder_text = <span foreground="##7895a0">Enter password...</span>
    check_color = rgba(82, 158, 249, 1.0)
    fail_color = rgba(248, 98, 101, 1.0)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    position = 0, -60
    halign = center
    valign = center
}
