# Gruvbox Dark theme for Yazi
# Matches Alacritty, Zellij, and Neovim color schemes

[mgr]
cwd = { fg = "#7daea3" }

# Find
find_keyword  = { fg = "#282828", bg = "#d8a657", bold = true }
find_position = { fg = "#d3869b", bg = "reset", bold = true }

# Symlink
symlink_target = { fg = "#89b482", italic = true }

# Marker
marker_copied   = { fg = "#a9b665", bg = "#a9b665" }
marker_cut      = { fg = "#ea6962", bg = "#ea6962" }
marker_marked   = { fg = "#7daea3", bg = "#7daea3" }
marker_selected = { fg = "#d8a657", bg = "#d8a657" }
marker_symbol   = "│"

# Count
count_copied   = { fg = "#282828", bg = "#a9b665" }
count_cut      = { fg = "#282828", bg = "#ea6962" }
count_selected = { fg = "#282828", bg = "#d8a657" }

# Border
border_symbol = "│"
border_style  = { fg = "#504945" }

[tabs]
active   = { fg = "#282828", bg = "#a9b665", bold = true }
inactive = { fg = "#d4be98", bg = "#3c3836" }

[mode]
normal_main = { fg = "#282828", bg = "#7daea3", bold = true }
normal_alt  = { fg = "#7daea3", bg = "#3c3836" }
select_main = { fg = "#282828", bg = "#d8a657", bold = true }
select_alt  = { fg = "#d8a657", bg = "#3c3836" }
unset_main  = { fg = "#282828", bg = "#ea6962", bold = true }
unset_alt   = { fg = "#ea6962", bg = "#3c3836" }

[status]
perm_sep   = { fg = "#504945" }
perm_type  = { fg = "#a9b665" }
perm_read  = { fg = "#d8a657" }
perm_write = { fg = "#ea6962" }
perm_exec  = { fg = "#89b482" }

progress_label  = { fg = "#d4be98", bold = true }
progress_normal = { fg = "#7daea3", bg = "#3c3836" }
progress_error  = { fg = "#ea6962", bg = "#3c3836" }

[which]
border          = { fg = "#7daea3" }
cols            = 3
cand            = { fg = "#89b482" }
rest            = { fg = "#928374" }
desc            = { fg = "#d4be98" }
separator_style = { fg = "#504945" }

[confirm]
border  = { fg = "#7daea3" }
title   = { fg = "#7daea3" }
btn_yes = { fg = "#282828", bg = "#a9b665", bold = true }
btn_no  = { fg = "#d4be98", bg = "#3c3836" }

[spot]
border   = { fg = "#7daea3" }
title    = { fg = "#7daea3" }
tbl_col  = { fg = "#7daea3" }
tbl_cell = { fg = "#282828", bg = "#d8a657" }

[notify]
title_info  = { fg = "#a9b665" }
title_warn  = { fg = "#d8a657" }
title_error = { fg = "#ea6962" }

[pick]
border = { fg = "#7daea3" }
active = { fg = "#282828", bg = "#a9b665", bold = true }

[input]
border = { fg = "#7daea3" }

[cmp]
border = { fg = "#7daea3" }
active = { fg = "#282828", bg = "#a9b665" }

[tasks]
border = { fg = "#7daea3" }
title  = { fg = "#7daea3" }

[filetype]
rules = [
	# Image
	{ mime = "**/image/*", fg = "#d3869b" },
	# Media
	{ mime = "**/{audio,video}/*", fg = "#d8a657" },
	# Archive
	{ mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#ea6962" },
	# Document
	{ mime = "**/application/{pdf,doc,rtf}", fg = "#89b482" },
	# Special file
	{ url = "*", is = "orphan", bg = "#ea6962" },
	{ url = "*", is = "exec", fg = "#a9b665" },
	# Fallback directories
	{ url = "*/", fg = "#7daea3" },
]
