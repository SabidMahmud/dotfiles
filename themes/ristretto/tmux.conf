# Tmux Theme - Auto Generated
set -g status-style "bg=#2c2525,fg=#e6d9db"
set -g pane-border-style "fg=#2c2525"
set -g pane-active-border-style "fg=#f38d70"

# Window status
set -g window-status-format " #I:#W "
set -g window-status-current-format " #[bg=#f38d70,fg=#2c2525,bold] #I:#W #[default] "

# Message
set -g message-style "bg=#f38d70,fg=#2c2525,bold"
