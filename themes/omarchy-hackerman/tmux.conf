# Omarchy Hackerman
set -g status-style "bg=#0B0C16,fg=#ddf7ff"
set -g pane-border-style "fg=#1f253a"
set -g pane-active-border-style "fg=#82FB9C"
set -g window-status-format " #I:#W "
set -g window-status-current-format " #[bg=#82FB9C,fg=#0B0C16,bold] #I:#W #[default] "
set -g message-style "bg=#82FB9C,fg=#0B0C16,bold"
