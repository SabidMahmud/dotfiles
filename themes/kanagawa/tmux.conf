# Tmux Theme - Auto Generated
set -g status-style "bg=#1f1f28,fg=#dcd7ba"
set -g pane-border-style "fg=#090618"
set -g pane-active-border-style "fg=#7e9cd8"

# Window status
set -g window-status-format " #I:#W "
set -g window-status-current-format " #[bg=#7e9cd8,fg=#1f1f28,bold] #I:#W #[default] "

# Message
set -g message-style "bg=#7e9cd8,fg=#1f1f28,bold"
