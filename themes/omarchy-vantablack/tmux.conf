# Omarchy Vantablack
set -g status-style "bg=#000000,fg=#ffffff"
set -g pane-border-style "fg=#1a1a1a"
set -g pane-active-border-style "fg=#8d8d8d"
set -g window-status-format " #I:#W "
set -g window-status-current-format " #[bg=#8d8d8d,fg=#000000,bold] #I:#W #[default] "
set -g message-style "bg=#8d8d8d,fg=#000000,bold"
