# Omarchy White
set -g status-style "bg=#ffffff,fg=#000000"
set -g pane-border-style "fg=#c0c0c0"
set -g pane-active-border-style "fg=#6e6e6e"
set -g window-status-format " #I:#W "
set -g window-status-current-format " #[bg=#6e6e6e,fg=#ffffff,bold] #I:#W #[default] "
set -g message-style "bg=#6e6e6e,fg=#ffffff,bold"
