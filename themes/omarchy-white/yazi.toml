# Omarchy White

[mgr]
hovered = { fg = "#000000", bg = "#c0c0c0" }
preview_hovered = { underline = true }
cwd = { fg = "#3e3e3e" }

# Find
find_keyword  = { fg = "#ffffff", bg = "#4a4a4a", bold = true }
find_position = { fg = "#2e2e2e", bg = "reset", bold = true }

# Symlink
symlink_target = { fg = "#3e3e3e", italic = true }

# Marker
marker_copied   = { fg = "#3a3a3a", bg = "#3a3a3a" }
marker_cut      = { fg = "#2a2a2a", bg = "#2a2a2a" }
marker_marked   = { fg = "#6e6e6e", bg = "#6e6e6e" }
marker_selected = { fg = "#4a4a4a", bg = "#4a4a4a" }
marker_symbol   = "│"

# Count
count_copied   = { fg = "#ffffff", bg = "#3a3a3a" }
count_cut      = { fg = "#ffffff", bg = "#2a2a2a" }
count_selected = { fg = "#ffffff", bg = "#4a4a4a" }

# Border
border_symbol = "│"
border_style  = { fg = "#f5f5f5" }

[tabs]
active   = { fg = "#ffffff", bg = "#3e3e3e", bold = true }
inactive = { fg = "#000000", bg = "#f5f5f5" }

[mode]
normal_main = { fg = "#ffffff", bg = "#6e6e6e", bold = true }
normal_alt  = { fg = "#6e6e6e", bg = "#f5f5f5" }
select_main = { fg = "#ffffff", bg = "#4a4a4a", bold = true }
select_alt  = { fg = "#4a4a4a", bg = "#f5f5f5" }
unset_main  = { fg = "#ffffff", bg = "#2a2a2a", bold = true }
unset_alt   = { fg = "#2a2a2a", bg = "#f5f5f5" }

[status]
perm_sep   = { fg = "#f5f5f5" }
perm_type  = { fg = "#3a3a3a" }
perm_read  = { fg = "#4a4a4a" }
perm_write = { fg = "#2a2a2a" }
perm_exec  = { fg = "#3e3e3e" }

progress_label  = { fg = "#000000", bold = true }
progress_normal = { fg = "#6e6e6e", bg = "#f5f5f5" }
progress_error  = { fg = "#2a2a2a", bg = "#f5f5f5" }

[which]
border          = { fg = "#6e6e6e" }
cols            = 3
cand            = { fg = "#3e3e3e" }
rest            = { fg = "#808080" }
desc            = { fg = "#000000" }
separator_style = { fg = "#f5f5f5" }
