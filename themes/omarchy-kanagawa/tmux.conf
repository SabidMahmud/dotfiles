# Omarchy Kanagawa
set -g status-style "bg=#1f1f28,fg=#dcd7ba"
set -g pane-border-style "fg=#363646"
set -g pane-active-border-style "fg=#dcd7ba"
set -g window-status-format " #I:#W "
set -g window-status-current-format " #[bg=#dcd7ba,fg=#1f1f28,bold] #I:#W #[default] "
set -g message-style "bg=#dcd7ba,fg=#1f1f28,bold"
