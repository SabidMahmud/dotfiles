# Omarchy Miasma
set -g status-style "bg=#222222,fg=#c2c2b0"
set -g pane-border-style "fg=#383838"
set -g pane-active-border-style "fg=#78824b"
set -g window-status-format " #I:#W "
set -g window-status-current-format " #[bg=#78824b,fg=#222222,bold] #I:#W #[default] "
set -g message-style "bg=#78824b,fg=#222222,bold"
