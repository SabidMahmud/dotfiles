# Omarchy Miasma

[mgr]
hovered = { fg = "#c2c2b0", bg = "#2c2c2c" }
preview_hovered = { underline = true }
cwd = { fg = "#c9a554" }

# Find
find_keyword  = { fg = "#222222", bg = "#b36d43", bold = true }
find_position = { fg = "#bb7744", bg = "reset", bold = true }

# Symlink
symlink_target = { fg = "#c9a554", italic = true }

# Marker
marker_copied   = { fg = "#5f875f", bg = "#5f875f" }
marker_cut      = { fg = "#685742", bg = "#685742" }
marker_marked   = { fg = "#78824b", bg = "#78824b" }
marker_selected = { fg = "#b36d43", bg = "#b36d43" }
marker_symbol   = "│"

# Count
count_copied   = { fg = "#222222", bg = "#5f875f" }
count_cut      = { fg = "#222222", bg = "#685742" }
count_selected = { fg = "#222222", bg = "#b36d43" }

# Border
border_symbol = "│"
border_style  = { fg = "#191919" }

[tabs]
active   = { fg = "#222222", bg = "#c9a554", bold = true }
inactive = { fg = "#c2c2b0", bg = "#191919" }

[mode]
normal_main = { fg = "#222222", bg = "#78824b", bold = true }
normal_alt  = { fg = "#78824b", bg = "#191919" }
select_main = { fg = "#222222", bg = "#b36d43", bold = true }
select_alt  = { fg = "#b36d43", bg = "#191919" }
unset_main  = { fg = "#222222", bg = "#685742", bold = true }
unset_alt   = { fg = "#685742", bg = "#191919" }

[status]
perm_sep   = { fg = "#191919" }
perm_type  = { fg = "#5f875f" }
perm_read  = { fg = "#b36d43" }
perm_write = { fg = "#685742" }
perm_exec  = { fg = "#c9a554" }

progress_label  = { fg = "#c2c2b0", bold = true }
progress_normal = { fg = "#78824b", bg = "#191919" }
progress_error  = { fg = "#685742", bg = "#191919" }

[which]
border          = { fg = "#78824b" }
cols            = 3
cand            = { fg = "#c9a554" }
rest            = { fg = "#666666" }
desc            = { fg = "#c2c2b0" }
separator_style = { fg = "#191919" }
