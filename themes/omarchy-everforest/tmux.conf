# Omarchy Everforest
set -g status-style "bg=#2d353b,fg=#d3c6aa"
set -g pane-border-style "fg=#3d484d"
set -g pane-active-border-style "fg=#7fbbb3"
set -g window-status-format " #I:#W "
set -g window-status-current-format " #[bg=#7fbbb3,fg=#2d353b,bold] #I:#W #[default] "
set -g message-style "bg=#7fbbb3,fg=#2d353b,bold"
