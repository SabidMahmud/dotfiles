# Omarchy Everforest

[mgr]
hovered = { fg = "#d3c6aa", bg = "#343f44" }
preview_hovered = { underline = true }
cwd = { fg = "#83c092" }

# Find
find_keyword  = { fg = "#2d353b", bg = "#dbbc7f", bold = true }
find_position = { fg = "#d699b6", bg = "reset", bold = true }

# Symlink
symlink_target = { fg = "#83c092", italic = true }

# Marker
marker_copied   = { fg = "#a7c080", bg = "#a7c080" }
marker_cut      = { fg = "#e67e80", bg = "#e67e80" }
marker_marked   = { fg = "#7fbbb3", bg = "#7fbbb3" }
marker_selected = { fg = "#dbbc7f", bg = "#dbbc7f" }
marker_symbol   = "│"

# Count
count_copied   = { fg = "#2d353b", bg = "#a7c080" }
count_cut      = { fg = "#2d353b", bg = "#e67e80" }
count_selected = { fg = "#2d353b", bg = "#dbbc7f" }

# Border
border_symbol = "│"
border_style  = { fg = "#21272c" }

[tabs]
active   = { fg = "#2d353b", bg = "#83c092", bold = true }
inactive = { fg = "#d3c6aa", bg = "#21272c" }

[mode]
normal_main = { fg = "#2d353b", bg = "#7fbbb3", bold = true }
normal_alt  = { fg = "#7fbbb3", bg = "#21272c" }
select_main = { fg = "#2d353b", bg = "#dbbc7f", bold = true }
select_alt  = { fg = "#dbbc7f", bg = "#21272c" }
unset_main  = { fg = "#2d353b", bg = "#e67e80", bold = true }
unset_alt   = { fg = "#e67e80", bg = "#21272c" }

[status]
perm_sep   = { fg = "#21272c" }
perm_type  = { fg = "#a7c080" }
perm_read  = { fg = "#dbbc7f" }
perm_write = { fg = "#e67e80" }
perm_exec  = { fg = "#83c092" }

progress_label  = { fg = "#d3c6aa", bold = true }
progress_normal = { fg = "#7fbbb3", bg = "#21272c" }
progress_error  = { fg = "#e67e80", bg = "#21272c" }

[which]
border          = { fg = "#7fbbb3" }
cols            = 3
cand            = { fg = "#83c092" }
rest            = { fg = "#475258" }
desc            = { fg = "#d3c6aa" }
separator_style = { fg = "#21272c" }
