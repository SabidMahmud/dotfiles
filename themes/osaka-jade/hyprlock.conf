# Hyprlock theme: osaka-jade
# Auto-generated by theme-switch — do not edit directly.

general {
    disable_loading_bar = true
    grace = 0
    hide_cursor = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 7
    brightness = 0.75
    contrast = 0.9
    vibrancy = 0.15
    vibrancy_darkness = 0.0
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%I:%M %p")"
    color = rgba(201, 209, 217, 1.0)
    font_size = 64
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %B %d, %Y")"
    color = rgba(54, 211, 153, 0.9)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 16
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(54, 211, 153, 0.9)
    inner_color = rgba(22, 27, 34, 0.6)
    font_color = rgba(201, 209, 217, 1.0)
    fade_on_empty = false
    placeholder_text = <span foreground="##888888">Password...</span>
    hide_input = false
    check_color = rgba(54, 211, 153, 1.0)
    fail_color = rgba(240, 71, 71, 1.0)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    position = 0, -60
    halign = center
    valign = center
}
