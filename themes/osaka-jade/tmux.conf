# Tmux Theme - Auto Generated
set -g status-style "bg=#111c18,fg=#C1C497"
set -g pane-border-style "fg=#23372B"
set -g pane-active-border-style "fg=#509475"

# Window status
set -g window-status-format " #I:#W "
set -g window-status-current-format " #[bg=#509475,fg=#111c18,bold] #I:#W #[default] "

# Message
set -g message-style "bg=#509475,fg=#111c18,bold"
