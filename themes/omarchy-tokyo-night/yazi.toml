# Omarchy Tokyo Night

[mgr]
hovered = { fg = "#a9b1d6", bg = "#24283b" }
preview_hovered = { underline = true }
cwd = { fg = "#449dab" }

# Find
find_keyword  = { fg = "#1a1b26", bg = "#e0af68", bold = true }
find_position = { fg = "#ad8ee6", bg = "reset", bold = true }

# Symlink
symlink_target = { fg = "#449dab", italic = true }

# Marker
marker_copied   = { fg = "#9ece6a", bg = "#9ece6a" }
marker_cut      = { fg = "#f7768e", bg = "#f7768e" }
marker_marked   = { fg = "#7aa2f7", bg = "#7aa2f7" }
marker_selected = { fg = "#e0af68", bg = "#e0af68" }
marker_symbol   = "│"

# Count
count_copied   = { fg = "#1a1b26", bg = "#9ece6a" }
count_cut      = { fg = "#1a1b26", bg = "#f7768e" }
count_selected = { fg = "#1a1b26", bg = "#e0af68" }

# Border
border_symbol = "│"
border_style  = { fg = "#13141c" }

[tabs]
active   = { fg = "#1a1b26", bg = "#449dab", bold = true }
inactive = { fg = "#a9b1d6", bg = "#13141c" }

[mode]
normal_main = { fg = "#1a1b26", bg = "#7aa2f7", bold = true }
normal_alt  = { fg = "#7aa2f7", bg = "#13141c" }
select_main = { fg = "#1a1b26", bg = "#e0af68", bold = true }
select_alt  = { fg = "#e0af68", bg = "#13141c" }
unset_main  = { fg = "#1a1b26", bg = "#f7768e", bold = true }
unset_alt   = { fg = "#f7768e", bg = "#13141c" }

[status]
perm_sep   = { fg = "#13141c" }
perm_type  = { fg = "#9ece6a" }
perm_read  = { fg = "#e0af68" }
perm_write = { fg = "#f7768e" }
perm_exec  = { fg = "#449dab" }

progress_label  = { fg = "#a9b1d6", bold = true }
progress_normal = { fg = "#7aa2f7", bg = "#13141c" }
progress_error  = { fg = "#f7768e", bg = "#13141c" }

[which]
border          = { fg = "#7aa2f7" }
cols            = 3
cand            = { fg = "#449dab" }
rest            = { fg = "#414868" }
desc            = { fg = "#a9b1d6" }
separator_style = { fg = "#13141c" }
