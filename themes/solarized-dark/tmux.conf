# Tmux Theme - Solarized Dark
set -g status-style "bg=#002b36,fg=#839496"
set -g pane-border-style "fg=#073642"
set -g pane-active-border-style "fg=#268bd2"

# Window status
set -g window-status-format " #I:#W "
set -g window-status-current-format " #[bg=#268bd2,fg=#002b36,bold] #I:#W #[default] "

# Message
set -g message-style "bg=#268bd2,fg=#002b36,bold"
