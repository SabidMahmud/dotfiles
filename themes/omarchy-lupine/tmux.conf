# Omarchy Lupine
set -g status-style "bg=#fafafa,fg=#212121"
set -g pane-border-style "fg=#d0d0d0"
set -g pane-active-border-style "fg=#3264eb"
set -g window-status-format " #I:#W "
set -g window-status-current-format " #[bg=#3264eb,fg=#fafafa,bold] #I:#W #[default] "
set -g message-style "bg=#3264eb,fg=#fafafa,bold"
