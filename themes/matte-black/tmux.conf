# Tmux Theme - Auto Generated
set -g status-style "bg=#121212,fg=#bebebe"
set -g pane-border-style "fg=#333333"
set -g pane-active-border-style "fg=#e68e0d"

# Window status
set -g window-status-format " #I:#W "
set -g window-status-current-format " #[bg=#e68e0d,fg=#121212,bold] #I:#W #[default] "

# Message
set -g message-style "bg=#e68e0d,fg=#121212,bold"
