# Tmux Theme - Auto Generated
set -g status-style "bg=#faf4ed,fg=#575279"
set -g pane-border-style "fg=#f2e9e1"
set -g pane-active-border-style "fg=#56949f"

# Window status
set -g window-status-format " #I:#W "
set -g window-status-current-format " #[bg=#56949f,fg=#faf4ed,bold] #I:#W #[default] "

# Message
set -g message-style "bg=#56949f,fg=#faf4ed,bold"
