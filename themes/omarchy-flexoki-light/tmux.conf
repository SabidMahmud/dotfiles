# Omarchy Flexoki Light
set -g status-style "bg=#FFFCF0,fg=#100F0F"
set -g pane-border-style "fg=#CECDC3"
set -g pane-active-border-style "fg=#205EA6"
set -g window-status-format " #I:#W "
set -g window-status-current-format " #[bg=#205EA6,fg=#FFFCF0,bold] #I:#W #[default] "
set -g message-style "bg=#205EA6,fg=#FFFCF0,bold"
