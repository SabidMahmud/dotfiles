# Catppuccin Frappé
set -g status-style "bg=#303446,fg=#c6d0f5"
set -g pane-border-style "fg=#51576d"
set -g pane-active-border-style "fg=#8caaee"

# Window status
set -g window-status-format " #I:#W "
set -g window-status-current-format " #[bg=#8caaee,fg=#303446,bold] #I:#W #[default] "

# Message
set -g message-style "bg=#8caaee,fg=#303446,bold"
