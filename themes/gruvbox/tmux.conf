# Tmux Theme - Auto Generated
set -g status-style "bg=#282828,fg=#d4be98"
set -g pane-border-style "fg=#3c3836"
set -g pane-active-border-style "fg=#7daea3"

# Window status
set -g window-status-format " #I:#W "
set -g window-status-current-format " #[bg=#7daea3,fg=#282828,bold] #I:#W #[default] "

# Message
set -g message-style "bg=#7daea3,fg=#282828,bold"
