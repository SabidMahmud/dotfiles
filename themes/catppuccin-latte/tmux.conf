# Catppuccin Latte
set -g status-style "bg=#eff1f5,fg=#4c4f69"
set -g pane-border-style "fg=#bcc0cc"
set -g pane-active-border-style "fg=#1e66f5"

# Window status
set -g window-status-format " #I:#W "
set -g window-status-current-format " #[bg=#1e66f5,fg=#eff1f5,bold] #I:#W #[default] "

# Message
set -g message-style "bg=#1e66f5,fg=#eff1f5,bold"
