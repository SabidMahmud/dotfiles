# Omarchy Osaka Jade

[mgr]
hovered = { fg = "#C1C497", bg = "#23372B" }
preview_hovered = { underline = true }
cwd = { fg = "#2DD5B7" }

# Find
find_keyword  = { fg = "#111c18", bg = "#459451", bold = true }
find_position = { fg = "#D2689C", bg = "reset", bold = true }

# Symlink
symlink_target = { fg = "#2DD5B7", italic = true }

# Marker
marker_copied   = { fg = "#549e6a", bg = "#549e6a" }
marker_cut      = { fg = "#FF5345", bg = "#FF5345" }
marker_marked   = { fg = "#509475", bg = "#509475" }
marker_selected = { fg = "#459451", bg = "#459451" }
marker_symbol   = "│"

# Count
count_copied   = { fg = "#111c18", bg = "#549e6a" }
count_cut      = { fg = "#111c18", bg = "#FF5345" }
count_selected = { fg = "#111c18", bg = "#459451" }

# Border
border_symbol = "│"
border_style  = { fg = "#0c1512" }

[tabs]
active   = { fg = "#111c18", bg = "#2DD5B7", bold = true }
inactive = { fg = "#C1C497", bg = "#0c1512" }

[mode]
normal_main = { fg = "#111c18", bg = "#509475", bold = true }
normal_alt  = { fg = "#509475", bg = "#0c1512" }
select_main = { fg = "#111c18", bg = "#459451", bold = true }
select_alt  = { fg = "#459451", bg = "#0c1512" }
unset_main  = { fg = "#111c18", bg = "#FF5345", bold = true }
unset_alt   = { fg = "#FF5345", bg = "#0c1512" }

[status]
perm_sep   = { fg = "#0c1512" }
perm_type  = { fg = "#549e6a" }
perm_read  = { fg = "#459451" }
perm_write = { fg = "#FF5345" }
perm_exec  = { fg = "#2DD5B7" }

progress_label  = { fg = "#C1C497", bold = true }
progress_normal = { fg = "#509475", bg = "#0c1512" }
progress_error  = { fg = "#FF5345", bg = "#0c1512" }

[which]
border          = { fg = "#509475" }
cols            = 3
cand            = { fg = "#2DD5B7" }
rest            = { fg = "#53685B" }
desc            = { fg = "#C1C497" }
separator_style = { fg = "#0c1512" }
