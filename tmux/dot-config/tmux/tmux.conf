# ============================================
# Craftzdog TMUX Configuration
# Location: ~/.config/tmux/tmux.conf
# ============================================

# 1. TERMINAL & PERFORMANCE
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -as terminal-features ",xterm*:RGB"

# Fast escape handling for Neovim & editors
set -sg escape-time 10
set -g repeat-time 0
set -g focus-events on

# Mouse support and scrollback history
set -g mouse on
set -g history-limit 2051072

# Clipboard, passthrough & window renumbering
set -g set-clipboard on
set -g allow-passthrough on
set -g renumber-windows on

# Dynamic terminal title
set -g set-titles on
set -g set-titles-string "#T"

# 2. KEYBINDINGS (Craftzdog Style)
# Action key: Ctrl + t
unbind C-b
set-option -g prefix C-t
bind-key C-t send-prefix

# Reload settings
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

# Open current directory in file manager
bind o run-shell "open '#{pane_current_path}' 2>/dev/null || xdg-open '#{pane_current_path}'"

# Kill all other panes except current
bind -r e kill-pane -a

# Move windows with Ctrl+Shift+Left/Right
bind-key -n C-S-Left swap-window -t -1 \; previous-window
bind-key -n C-S-Right swap-window -t +1 \; next-window

# Keep panes evenly sized when splitting (and inherit current directory)
bind | split-window -h -c "#{pane_current_path}" \; select-layout even-horizontal
bind % split-window -h -c "#{pane_current_path}" \; select-layout even-horizontal
bind - split-window -v -c "#{pane_current_path}" \; select-layout even-vertical
bind '"' split-window -v -c "#{pane_current_path}" \; select-layout even-vertical

# 3. POPUP UTILITIES
# Lazygit in floating popup
bind -r g display-popup -d '#{pane_current_path}' -w90% -h90% -E lazygit

# 4. VIM COPY MODE
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

# 5. WINDOW & PANE STYLES (Solarized 256 / Craftzdog look'n feel)
set -g window-style "fg=colour10,bg=default"
set -g window-active-style "fg=colour12,bg=default"

# Pane number display colors
set -g display-panes-active-colour colour33
set -g display-panes-colour colour166

# Clock mode
set -g clock-mode-colour colour64

# Floating popup window style
set -g popup-style "bg=default"
set -g popup-border-style "fg=colour167,bg=default"
set -g popup-border-lines rounded

# 6. STATUS LINE
source-file -q ~/.config/tmux/statusline.conf
