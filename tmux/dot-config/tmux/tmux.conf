# ==========================================
# Tmux Configuration
# ==========================================

# 1. Colors and Truecolor Support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# 2. Change Prefix from C-b to C-a
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# 3. Enable Mouse Support
set -g mouse on

# 4. Start numbering at 1 (easier keyboard reach)
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# 5. Intuitive Window Splitting
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# 6. Easy Window Navigation (Shift + Left/Right)
bind -n S-Left  previous-window
bind -n S-Right next-window

# 7. Vim motions in copy mode
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# 8. Reload Config easily
bind r source-file ~/.config/tmux/tmux.conf \; display "Tmux Config Reloaded!"

# 9. Load Theme (Auto-managed by theme-switch)
if-shell "[ -f ~/.config/tmux/theme.conf ]" "source-file ~/.config/tmux/theme.conf"
